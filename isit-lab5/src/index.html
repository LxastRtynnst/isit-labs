<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Бронирование спортивных площадок</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div id="login-screen" class="container" style="max-width: 400px;">
    <form id="login-form" class="card">
      <h1>Вход в систему</h1>

      <label for="login-email">Email</label>
      <input id="login-email" type="text" value="user@sport.local">
      <div class="error" id="error-email"></div>

      <label for="login-password">Пароль</label>
      <input id="login-password" type="password" value="123456">
      <div class="error" id="error-password"></div>

      <div class="error" id="error-login"></div>
      <button type="submit" id="login-button" class="primary">Войти</button>
    </form>
  </div>

  <div id="main-screen" hidden>
    <div class="topbar">
      <strong>Бронирование площадок</strong>
      <span>
        <span id="user-name"></span>
        <button id="logout-button">Выйти</button>
      </span>
    </div>

    <div class="container">

      <form id="booking-form" class="card">
        <h2>Новая бронь</h2>

        <label for="booking-title">Название / комментарий</label>
        <input id="booking-title" type="text">
        <div class="error" id="error-title"></div>

        <label for="booking-area">Площадка</label>
        <select id="booking-area">
          <option value="1">Футбольное поле №1</option>
          <option value="2">Теннисный корт №2</option>
          <option value="3">Баскетбольная площадка</option>
        </select>

        <label for="booking-date">Дата</label>
        <input id="booking-date" type="date">
        <div class="error" id="error-date"></div>

        <div class="error" id="error-form"></div>
        <button type="submit" id="booking-button" class="primary">Добавить в список</button>
      </form>

      <h2>Список броней</h2>
      <div class="toolbar">
        <select id="status-filter">
          <option value="">Все статусы</option>
          <option value="new">Новая</option>
          <option value="confirmed">Подтверждена</option>
          <option value="cancelled">Отменена</option>
        </select>
        <input id="search-input" type="text" placeholder="Поиск по названию...">
        <button id="refresh-button">Загрузить с сервера</button>
      </div>

      <div id="message" class="message" hidden></div>

      <table id="booking-table">
        <thead>
          <tr>
            <th>№</th>
            <th>Название</th>
            <th>Статус</th>
            <th>Приоритет</th>
            <th>Дата</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="booking-body"></tbody>
      </table>

      <p class="counter">Броней на странице: <span id="counter">0</span></p>
    </div>
  </div>

  <script src="js/mock-api.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
